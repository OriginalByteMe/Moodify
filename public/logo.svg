<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Moodify logo">
  <defs>
    <linearGradient id="band-violet" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#A21CAF"/>
    </linearGradient>
    <linearGradient id="band-magenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C026D3"/>
      <stop offset="0.55" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="band-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.6" stop-color="#FBA524"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="band-blue" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="logo-circle">
      <circle cx="540" cy="540" r="345"/>
    </clipPath>
  </defs>
  <g clip-path="url(#logo-circle)">
    <rect x="195" y="195" width="690" height="690" fill="url(#band-violet)"/>
    <!-- Parallel high-energy ripples, like the original waves but smooth -->
    <path fill="url(#band-magenta)"
          d="M 150 405 C 230 320, 310 320, 400 405 S 560 490, 650 440 S 840 330, 930 360 L 930 930 L 150 930 Z"/>
    <path fill="url(#band-orange)"
          d="M 150 555 C 230 470, 310 470, 400 555 S 560 640, 650 590 S 840 480, 930 510 L 930 930 L 150 930 Z"/>
    <path fill="url(#band-blue)"
          d="M 150 705 C 230 625, 310 625, 400 705 S 560 785, 650 735 S 840 630, 930 655 L 930 930 L 150 930 Z"/>
  </g>
</svg>
